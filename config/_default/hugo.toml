# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

# theme = "blowfish"
baseURL = "https://sergiogimenez.com/"
defaultContentLanguage = "en"
# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

# Only `en` is configured. The es/fr sibling files under content/ are cross-post
# translations that aren't published; ignore them so Hugo 0.158+ doesn't fold
# their front-matter taxonomy terms into the English site. Drop this if the site
# ever goes multilingual (and configure the languages instead).
ignoreFiles = ['/index\.es\.md$', '/index\.fr\.md$']

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
pagerSize = 100

[imaging]
anchor = 'Center'

[taxonomies]
tag = "tags"
category = "categories"
author = "authors"
series = "series"

[sitemap]
changefreq = 'daily'
filename = 'sitemap.xml'
priority = 0.5

[params.plausible]
domain = "plausible.sergiogimenez.com"


[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
  [outputFormats.LLMSFull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true

[outputs]
home = ["HTML", "RSS", "JSON", "LLMS", "LLMSFull", "Markdown"]
page = ["HTML", "Markdown"]

[related]
threshold = 0
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 100

[[related.indices]]
name = "series"
weight = 50

[[related.indices]]
name = "authors"
weight = 20

[[related.indices]]
name = "date"
weight = 10

[[related.indices]]
applyFilter = false
name = 'fragmentrefs'
type = 'fragments'
weight = 10

[author]
name = "Sergio Gimenez"
# image = "https://sergiogimenez.com/images/profile.jpg"  # Ensure this URL is correct
